{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body_class %}auth-body{% endblock %}
{% block auth_content %}
<div class="auth-card">
  <div class="auth-brand">
    <span class="brand-icon"><i class="bi bi-shield-shaded"></i></span>
    <span>Sentinel<strong>Ops</strong></span>
  </div>
  <h2 class="h5 mb-1">Sign in to your console</h2>
  <p class="text-secondary small mb-4">Monitor deployments, incidents and service health.</p>
  {% include "_flash.html" %}
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label for="username" class="form-label">Username or email</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-person"></i></span>
        <input type="text" class="form-control" id="username" name="username" value="{{ username or '' }}" required autofocus autocomplete="username">
      </div>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
      </div>
    </div>
    <div class="form-check mb-4">
      <input class="form-check-input" type="checkbox" id="remember" name="remember" value="1">
      <label class="form-check-label small" for="remember">Keep me signed in</label>
    </div>
    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> Sign in</button>
  </form>
  <p class="text-center small text-secondary mt-4 mb-0">No account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
</div>
{% endblock %}
