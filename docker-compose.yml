name: sentinelops

services:
  mysql:
    image: mysql:8.0
    container_name: sentinelops-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sentinelops}
      MYSQL_USER: ${MYSQL_USER:-sentinel}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # $$ escapes $ so the variable is expanded inside the container
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - sentinel-net

  dashboard:
    build:
      context: ./dashboard
    container_name: sentinelops-dashboard
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-sentinelops}
      DB_USER: ${MYSQL_USER:-sentinel}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      SENTINELOPS_API_KEY: ${SENTINELOPS_API_KEY:?Set SENTINELOPS_API_KEY in .env}
      FLASK_ENV: ${FLASK_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      DEMO_APP_HEALTH_URL: http://demo-app:8080/health
    ports:
      - "${DASHBOARD_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - sentinel-net

  demo-app:
    build:
      context: ./demo-app
    container_name: sentinelops-demo-app
    restart: unless-stopped
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
      BUILD_NUMBER: ${BUILD_NUMBER:-local}
      COMMIT_ID: ${COMMIT_ID:-local}
      BREAK: ${BREAK:-false}
    ports:
      - "${DEMO_APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sentinel-net

volumes:
  mysql_data:
    name: sentinelops_mysql_data

networks:
  sentinel-net:
    name: sentinelops-net
